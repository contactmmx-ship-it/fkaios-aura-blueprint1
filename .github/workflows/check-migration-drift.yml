name: Check production migration drift

# Fails when production has a migration that the repository does not record
# (supabase/migrations or supabase/live-snapshot/migrations). Read-only: it
# lists applied migrations and never changes the database.

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/tools/check_migration_drift.py"
      - ".github/workflows/check-migration-drift.yml"
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nrlsqshkjuuwiovthrnb
    steps:
      - uses: actions/checkout@v4

      - name: List production migrations
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured in GitHub repository secrets."
            exit 1
          fi
          status=$(curl -sS -o /tmp/live.json -w '%{http_code}' \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/migrations" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")
          if [ "$status" != "200" ]; then
            echo "::error::Listing production migrations returned HTTP $status"
            head -c 500 /tmp/live.json
            exit 1
          fi

      - name: Compare with repository
        run: python3 .github/tools/check_migration_drift.py /tmp/live.json
