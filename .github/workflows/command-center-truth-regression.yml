name: FKAIOS Command Center truth regression

on:
  pull_request:
    paths:
      - "src/components/fkaios/FounderStory.tsx"
      - "src/components/fkaios/GovernanceDashboard.tsx"
      - "supabase/functions/governance-dashboard/index.ts"
      - "supabase/migrations/*command_center_workforce_and_revenue_truth.sql"
      - ".github/workflows/command-center-truth-regression.yml"

permissions:
  contents: read

jobs:
  command-center-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Set up Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.9.7

      - name: Type-check governance dashboard Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/governance-dashboard/index.ts
