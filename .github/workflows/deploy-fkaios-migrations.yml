name: Deploy approved FKAIOS database migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/*.sql"
      - ".github/workflows/deploy-fkaios-migrations.yml"

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nrlsqshkjuuwiovthrnb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate migration token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi
      - name: Apply only new migrations in this commit
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::Cannot establish a safe migration diff for this push."
            exit 1
          fi
          mapfile -t migrations < <(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'supabase/migrations/*.sql' | sort)
          for file in "${migrations[@]}"; do
            [ -f "$file" ] || continue
            base="$(basename "$file" .sql)"
            version="${base%%_*}"
            name="${base#*_}"
            if [[ ! "$version" =~ ^[0-9]{14}$ ]]; then
              echo "::error::Invalid migration filename: $base"
              exit 1
            fi
            if [[ "$name" == *[!a-zA-Z0-9_]* ]]; then
              echo "::error::Invalid migration name: $name"
              exit 1
            fi
            echo "Applying reviewed migration $version ($name)"
            {
              cat "$file"
              printf "\nINSERT INTO supabase_migrations.schema_migrations (version, name, statements, created_by, idempotency_key) VALUES ('%s', '%s', ARRAY['Applied by reviewed GitHub Actions migration pipeline'], 'github-actions', 'fkaios:%s') ON CONFLICT (version) DO NOTHING;\n" "$version" "$name" "$version"
            } > /tmp/fkaios-migration.sql
            jq -n --rawfile query /tmp/fkaios-migration.sql '{query: $query, read_only: false}' > /tmp/fkaios-migration.json
            status="$(curl --silent --show-error --output /tmp/fkaios-response.json --write-out '%{http_code}' \
              --request POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary @/tmp/fkaios-migration.json)"
            if [ "$status" != "201" ]; then
              echo "::error::Migration $version failed through Supabase Management API (HTTP $status)."
              cat /tmp/fkaios-response.json
              exit 1
            fi
            echo "Migration $version applied."
          done
