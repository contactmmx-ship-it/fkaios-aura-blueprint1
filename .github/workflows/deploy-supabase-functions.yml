name: Deploy FKAIOS Supabase Functions
# Backend deployment trigger: keep Supabase Edge Functions in sync with main.

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nrlsqshkjuuwiovthrnb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Supabase token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in GitHub repository secrets."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.67.1

      - name: Deploy changed FKAIOS functions
        run: |
          supabase functions deploy ai-engine --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy founder-brain-tick --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy founder-objective --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy research-engine --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy builder-engine --project-ref "$SUPABASE_PROJECT_REF"
          # Scheduled engines: called by pg_cron with the heartbeat secret, not a
          # user JWT, so gateway JWT verification stays off (as deployed before).
          supabase functions deploy opportunity-engine --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy evolution-engine --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy executive-brain --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy workday-engine --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy staff-engine --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
