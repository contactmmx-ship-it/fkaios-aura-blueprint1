name: Deploy FKAIOS Supabase Functions
# Backend deployment trigger: keep Supabase Edge Functions in sync with main.

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nrlsqshkjuuwiovthrnb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Supabase token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in GitHub repository secrets."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.67.1

      # 29 Oct 2026: --use-api bundles on Supabase's servers (the route manual deploys use).
      # Local CLI bundling failed on every push from 28 Oct ~14:24 UTC while API deploys of the same code worked.
      - name: Deploy changed FKAIOS functions
        run: |
          # Brain Chat now consumes the canonical Founder Memory search.
          supabase functions deploy brain-engine --use-api --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy ai-engine --use-api --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy founder-brain-tick --use-api --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy founder-objective --use-api --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy research-engine --use-api --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy builder-engine --use-api --project-ref "$SUPABASE_PROJECT_REF"
          # Scheduled engines: called by pg_cron with the heartbeat secret, not a
          # user JWT, so gateway JWT verification stays off (as deployed before).
          supabase functions deploy opportunity-engine --no-verify-jwt --use-api --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy evolution-engine --no-verify-jwt --use-api --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy executive-brain --no-verify-jwt --use-api --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy executive-intelligence --no-verify-jwt --use-api --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy workday-engine --no-verify-jwt --use-api --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy staff-engine --no-verify-jwt --use-api --project-ref "$SUPABASE_PROJECT_REF"
          # Cron-auth repair: keep these endpoints gateway-JWT-disabled; handlers validate the shared secret.
          supabase functions deploy auto-pilot --no-verify-jwt --use-api --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy agent-scheduler --no-verify-jwt --use-api --project-ref "$SUPABASE_PROJECT_REF"
          # Also deploy the handlers whose auth/caller code changed in this PR.
          supabase functions deploy proposal-engine --no-verify-jwt --use-api --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy auto-agents-engine --no-verify-jwt --use-api --project-ref "$SUPABASE_PROJECT_REF"
          # Knowledge Vault / My Brain memory search (signed-in users; gateway JWT check on, as live).
          supabase functions deploy memory-search --use-api --project-ref "$SUPABASE_PROJECT_REF"
          # Draft Studio (My Brain): gateway JWT check off as deployed today; the handler verifies the user JWT itself.
          supabase functions deploy my-brain-engine --no-verify-jwt --use-api --project-ref "$SUPABASE_PROJECT_REF"
