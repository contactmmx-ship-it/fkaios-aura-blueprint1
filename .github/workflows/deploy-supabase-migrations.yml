name: Deploy FKAIOS Supabase migrations

# Production migrations deploy through CI only after merge to main.
# Pull requests must use secret-free/local validation; never link a PR job to production.
on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-supabase-migrations.yml"

permissions:
  contents: read

concurrency:
  group: fkaios-supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrations:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: nrlsqshkjuuwiovthrnb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required Supabase secrets
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured in GitHub repository secrets."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is not configured in GitHub repository secrets. Add the database password as an encrypted GitHub Actions secret; do not put it in the repository or chat."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.67.1

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preview pending migrations
        run: supabase db push --linked --dry-run

      - name: Apply pending migrations after merge
        run: supabase db push --linked
