name: Deploy FKAIOS Supabase migrations

# Preview on PR and main pushes. Applying production migrations requires an
# explicit workflow_dispatch confirmation until repository/live migration
# history has been reconciled. This prevents a merge from replaying old files.
on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/live-snapshot/migrations/**"
      - ".github/tools/*migration_history*.py"
      - ".github/workflows/deploy-supabase-migrations.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/live-snapshot/migrations/**"
      - ".github/tools/*migration_history*.py"
      - ".github/workflows/deploy-supabase-migrations.yml"
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: 'Type APPLY only after the pending migration list has been reviewed'
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'APPLY'

permissions:
  contents: read

concurrency:
  group: fkaios-supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrations:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_HOST: aws-1-ap-south-1.pooler.supabase.com
      SUPABASE_DB_USER: postgres.nrlsqshkjuuwiovthrnb
      SUPABASE_DB_PORT: "5432"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required Supabase database password
        shell: bash
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is not configured in GitHub repository secrets. Add the database password as an encrypted secret; do not put it in the repository or chat."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.67.1

      - name: Build database URL from encrypted password
        shell: bash
        run: |
          python3 <<'PY'
          import os
          from urllib.parse import quote, urlsplit

          user = quote(os.environ["SUPABASE_DB_USER"], safe="")
          password = quote(os.environ["SUPABASE_DB_PASSWORD"], safe="")
          host = os.environ["SUPABASE_DB_HOST"]
          port = os.environ["SUPABASE_DB_PORT"]
          uri = f"postgresql://{user}:{password}@{host}:{port}/postgres"
          parsed = urlsplit(uri)
          if not parsed.hostname or not parsed.port or not parsed.username or parsed.password is None:
              raise SystemExit("Could not construct a valid PostgreSQL connection URI.")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("SUPABASE_DB_URL=" + uri + "\n")
          PY

      - name: Test the history assembler
        run: python3 -m unittest discover -s .github/tools -p 'test_assemble_migration_history.py' -v

      - name: Assemble full migration history (CI workspace only, not committed)
        run: python3 .github/tools/assemble_migration_history.py

      - name: Preview pending migrations (no writes)
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Apply pending migrations after explicit confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.confirm_apply == 'APPLY'
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Confirm no automatic migration writes occurred
        if: github.event_name != 'workflow_dispatch' || inputs.confirm_apply != 'APPLY'
        run: echo "Preview only. Production migrations were not applied."
