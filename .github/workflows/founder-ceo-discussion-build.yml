name: FKAIOS Founder CEO discussion frontend build

on:
  pull_request:
    paths:
      - "src/components/fkaios/FounderCEOConversation.tsx"
      - "src/components/fkaio/AppShell.tsx"
      - "src/app/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/founder-ceo-discussion-build.yml"
  push:
    branches: [main]
    paths:
      - "src/components/fkaios/FounderCEOConversation.tsx"
      - "src/components/fkaio/AppShell.tsx"
      - "src/app/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/founder-ceo-discussion-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (current lockfile has one missing transitive entry)
        run: npm install --no-audit --no-fund
      - name: Build Console and CEO discussion UI
        run: npm run build
