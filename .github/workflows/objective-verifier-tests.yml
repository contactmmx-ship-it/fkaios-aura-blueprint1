name: FKAIOS objective verifier regression tests

on:
  pull_request:
    paths:
      - "supabase/functions/_shared/objective-verifier.ts"
      - "supabase/functions/_shared/objective-verifier.test.ts"
      - "supabase/functions/_shared/objective-loop.ts"
      - "supabase/functions/_shared/objective-loop-inventory.test.ts"
      - "supabase/functions/_shared/objective-loop-retire.test.ts"
      - "supabase/functions/_shared/objective-deadline.ts"
      - "supabase/functions/_shared/objective-deadline.test.ts"
      - "supabase/functions/_shared/llm-router.ts"
      - "supabase/functions/_shared/llm-router.test.ts"
      - "supabase/functions/_shared/resource-selection.ts"
      - "supabase/functions/_shared/resource-selection.test.ts"
      - "supabase/functions/_shared/task-output.ts"
      - "supabase/functions/_shared/task-output.test.ts"
      - "supabase/functions/_shared/work-engine.ts"
      - "supabase/functions/_shared/work-engine.test.ts"
      - "supabase/functions/ai-engine/index.ts"
      - "supabase/functions/ai-engine/index.test.ts"
      - ".github/workflows/objective-verifier-tests.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/functions/_shared/objective-verifier.ts"
      - "supabase/functions/_shared/objective-verifier.test.ts"
      - "supabase/functions/_shared/objective-loop.ts"
      - "supabase/functions/_shared/objective-loop-retire.test.ts"
      - "supabase/functions/_shared/objective-deadline.ts"
      - "supabase/functions/_shared/objective-deadline.test.ts"
      - "supabase/functions/_shared/llm-router.ts"
      - "supabase/functions/_shared/llm-router.test.ts"
      - "supabase/functions/_shared/resource-selection.ts"
      - "supabase/functions/_shared/resource-selection.test.ts"
      - "supabase/functions/_shared/task-output.ts"
      - "supabase/functions/_shared/task-output.test.ts"
      - "supabase/functions/_shared/work-engine.ts"
      - "supabase/functions/_shared/work-engine.test.ts"
      - "supabase/functions/ai-engine/index.ts"
      - "supabase/functions/ai-engine/index.test.ts"
      - ".github/workflows/objective-verifier-tests.yml"

permissions:
  contents: read

jobs:
  objective-verifier-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.9.7
      - name: Run objective-loop infrastructure inventory regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/objective-loop-inventory.test.ts
      - name: Run objective-loop retirement and terminal failure regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/objective-loop-retire.test.ts
      - name: Run objective verifier regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/objective-verifier.test.ts
      - name: Run objective deadline regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env supabase/functions/_shared/objective-deadline.test.ts
      - name: Run LLM router regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/llm-router.test.ts
      - name: Run resource selection regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/resource-selection.test.ts
      - name: Run AI engine execution-truth regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/ai-engine/index.test.ts
      - name: Run task-output truth regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/task-output.test.ts
      - name: Run worker engine regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/work-engine.test.ts
