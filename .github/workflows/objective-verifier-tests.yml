      - "supabase/functions/_shared/draft-memory.ts"
      - "supabase/functions/_shared/draft-memory.test.ts"
      - "supabase/functions/_shared/brain-chat.ts"
      - "supabase/functions/_shared/brain-chat.test.ts"
      - "supabase/functions/my-brain-engine/index.ts"
      - "supabase/functions/_shared/founder-brain.ts"
      - "supabase/functions/founder-objective/index.ts"
      - "supabase/functions/brain-engine/index.ts"
      - ".github/workflows/objective-verifier-tests.yml"

permissions:
  contents: read

jobs:
  objective-verifier-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.9.7
      - name: Run generated product integrity regression test
        run: deno test --no-check --allow-read src/app/product/\[id\]/route.test.ts
      - name: Run blocked-work escalation dedupe regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env supabase/functions/_shared/escalation-dedupe.test.ts
      - name: Run objective-loop infrastructure inventory regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/objective-loop-inventory.test.ts
      - name: Run objective-loop retirement and terminal failure regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/objective-loop-retire.test.ts
      - name: Run objective contract and product evidence regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/objective-contract.test.ts
      - name: Run objective verifier regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/objective-verifier.test.ts
      - name: Run objective deadline regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env supabase/functions/_shared/objective-deadline.test.ts
      - name: Run free-tier provider spending-boundary regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env supabase/functions/_shared/provider-policy.test.ts
      - name: Run LLM router regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/llm-router.test.ts
      - name: Run resource selection regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/resource-selection.test.ts
      - name: Run public product delivery URL regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/product-delivery.test.ts
      - name: Run AI engine execution-truth regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/ai-engine/index.test.ts
      - name: Run task-output truth regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/task-output.test.ts
      - name: Run worker engine regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/work-engine.test.ts
      - name: Run company OS capability routing regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/company-os.test.ts
      - name: Run objective-first background evaluation quota tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/capability-evaluation.test.ts
      - name: Run suite-version re-test regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/capability-discovery.suite.test.ts
      - name: Run AI World digest regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/world-digest.test.ts
      - name: Run shared memory recall tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/brain-recall.test.ts
      - name: Run Draft Studio memory-grounding tests
        run: deno test --no-check --node-modules-dir=auto --allow-env supabase/functions/_shared/draft-memory.test.ts
      - name: Brain Chat principles and no-provider reply tests
        run: deno test --no-check --node-modules-dir=auto --allow-env supabase/functions/_shared/brain-chat.test.ts
