name: FKAIOS objective verifier regression tests

on:
  pull_request:
    paths:
      - "supabase/functions/_shared/objective-verifier.ts"
      - "supabase/functions/_shared/objective-verifier.test.ts"
      - "supabase/functions/_shared/objective-loop.ts"
      - "supabase/functions/_shared/objective-deadline.ts"
      - "supabase/functions/_shared/objective-deadline.test.ts"
      - "supabase/functions/_shared/llm-router.ts"
      - "supabase/functions/_shared/llm-router.test.ts"
      - "supabase/functions/_shared/resource-selection.ts"
      - "supabase/functions/_shared/resource-selection.test.ts"
      - "src/components/fkaios/FounderStory.tsx"
      - "src/components/fkaios/GovernanceDashboard.tsx"
      - "supabase/functions/governance-dashboard/index.ts"
      - "supabase/migrations/*command_center_workforce_and_revenue_truth.sql"
      - ".github/workflows/objective-verifier-tests.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/functions/_shared/objective-verifier.ts"
      - "supabase/functions/_shared/objective-verifier.test.ts"
      - "supabase/functions/_shared/objective-loop.ts"
      - "supabase/functions/_shared/objective-deadline.ts"
      - "supabase/functions/_shared/objective-deadline.test.ts"
      - "supabase/functions/_shared/llm-router.ts"
      - "supabase/functions/_shared/llm-router.test.ts"
      - "supabase/functions/_shared/resource-selection.ts"
      - "supabase/functions/_shared/resource-selection.test.ts"
      - "src/components/fkaios/FounderStory.tsx"
      - "src/components/fkaios/GovernanceDashboard.tsx"
      - "supabase/functions/governance-dashboard/index.ts"
      - "supabase/migrations/*command_center_workforce_and_revenue_truth.sql"
      - ".github/workflows/objective-verifier-tests.yml"

permissions:
  contents: read

jobs:
  objective-verifier-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Lint changed frontend components
        run: npx eslint src/components/fkaios/FounderStory.tsx src/components/fkaios/GovernanceDashboard.tsx
      - name: Set up Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.9.7
      - name: Run objective verifier regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/objective-verifier.test.ts
      - name: Run objective deadline regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env supabase/functions/_shared/objective-deadline.test.ts
      - name: Run LLM router regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/llm-router.test.ts
      - name: Run resource selection regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/resource-selection.test.ts
      - name: Type-check governance dashboard Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/governance-dashboard/index.ts
