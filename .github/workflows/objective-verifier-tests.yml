      - "supabase/functions/_shared/llm-router.test.ts"
      - "supabase/functions/_shared/resource-selection.ts"
      - "supabase/functions/_shared/resource-selection.test.ts"
      - "supabase/functions/_shared/task-output.ts"
      - "supabase/functions/_shared/task-output.test.ts"
      - "supabase/functions/_shared/work-engine.ts"
      - "supabase/functions/_shared/work-engine.test.ts"
      - "supabase/functions/_shared/company-os.ts"
      - "supabase/functions/_shared/company-os.test.ts"
      - "supabase/functions/ai-engine/index.ts"
      - "supabase/functions/builder-engine/index.ts"
      - "supabase/functions/_shared/product-delivery.ts"
      - "supabase/functions/_shared/product-delivery.test.ts"
      - "supabase/functions/ai-engine/index.test.ts"
      - "src/app/product/\\[id\\]/route.ts"
      - "src/app/product/\\[id\\]/route.test.ts"
      - "supabase/functions/_shared/brain-recall.ts"
      - "supabase/functions/_shared/brain-recall.test.ts"
      - "supabase/functions/_shared/draft-memory.ts"
      - "supabase/functions/_shared/draft-memory.test.ts"
      - "supabase/functions/_shared/brain-chat.ts"
      - "supabase/functions/_shared/brain-chat.test.ts"
      - "supabase/functions/my-brain-engine/index.ts"
      - "supabase/functions/_shared/founder-brain.ts"
      - "supabase/functions/founder-objective/index.ts"
      - "supabase/functions/brain-engine/index.ts"
      - ".github/workflows/objective-verifier-tests.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/functions/_shared/objective-verifier.ts"
      - "supabase/functions/_shared/escalation-dedupe.ts"
      - "supabase/functions/_shared/escalation-dedupe.test.ts"
      - "supabase/functions/_shared/executive-planner.ts"
