name: FKAIOS objective verifier regression tests

on:
  pull_request:
    paths:
      - "supabase/functions/_shared/objective-verifier.ts"
      - "supabase/functions/_shared/objective-verifier.test.ts"
      - "supabase/functions/_shared/objective-loop.ts"
      - "supabase/functions/_shared/founder-discussion.ts"
      - "supabase/functions/_shared/founder-discussion.test.ts"
      - "supabase/functions/founder-objective/index.ts"
      - ".github/workflows/objective-verifier-tests.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/functions/_shared/objective-verifier.ts"
      - "supabase/functions/_shared/objective-verifier.test.ts"
      - "supabase/functions/_shared/objective-loop.ts"
      - ".github/workflows/objective-verifier-tests.yml"

permissions:
  contents: read

jobs:
  objective-verifier-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.9.7
      - name: Run objective verifier regression tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/objective-verifier.test.ts
      - name: Run founder CEO discussion contract tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/_shared/founder-discussion.test.ts
      - name: Type-check founder discussion contract
        run: deno check --node-modules-dir=auto supabase/functions/_shared/founder-discussion.ts
