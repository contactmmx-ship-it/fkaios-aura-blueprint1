name: One-time research regex repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-research-regex-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair deployed source and remove one-time workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("supabase/functions/ai-engine/index.ts")
          s = p.read_text()
          old = r'const researchNeeded = /\\b(research|market|facts?|sources?|verify|distributor|competitor|industry|trends?|data collection)\\b/i.test(taskText);'
          new = r'const researchNeeded = /\b(research|market|facts?|sources?|verify|distributor|competitor|industry|trends?|data collection)\b/i.test(taskText);'
          if old not in s:
              print("Research regex already repaired; nothing to do.")
          else:
              p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/one-time-research-regex-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/ai-engine/index.ts
          git commit -m "Fix founder research task detection regex"
          git push origin main
