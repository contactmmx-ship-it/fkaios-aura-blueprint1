name: Raahat Static Preview (GitHub Pages)

on:
  push:
    branches:
      - feature/brand-discovery-foundation
    paths:
      - "preview-static/**"
      - ".github/workflows/raahat-pages-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: raahat-static-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install preview dependencies
        working-directory: preview-static
        run: npm install --no-audit --no-fund
      - name: Build standalone static preview
        working-directory: preview-static
        run: npm run build
      - name: Upload built preview as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: raahat-static-preview-${{ github.sha }}
          path: preview-static/dist
          retention-days: 14
      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare GitHub Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview-static/dist
      - name: Deploy static preview
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
