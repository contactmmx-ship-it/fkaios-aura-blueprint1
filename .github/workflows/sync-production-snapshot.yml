name: Snapshot FKAIOS production state
# Read-only export of what is actually running in Supabase production, so the
# repository can hold an exact record of it (audit 2026-10-07, weakness 3:
# 113 live migrations vs 36 in the repo; most edge functions hand-deployed).
#
# - Reads every applied migration (version, name, SQL) through the Supabase
#   Management API and every edge function's deployed source via the CLI.
# - Writes them under supabase/live-snapshot/ (NOT supabase/migrations or
#   supabase/functions, so nothing here is ever deployed or re-applied).
# - Redacts JWTs, API keys and secret= query values before committing.
# - Pushes to a new branch snapshot/production-<timestamp>; never to main.
# Production is not modified by this workflow.

on:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nrlsqshkjuuwiovthrnb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.67.1

      - name: Export applied migrations
        # The CI access token may be scoped to function deploys only (the
        # database query API then answers 403). Record that and keep going so
        # the function-source export below still runs.
        run: |
          set -uo pipefail
          mkdir -p supabase/live-snapshot/migrations
          if ! curl -sS --fail -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"query":"select version, name, array_to_string(statements, E'\'';\\n\\n'\'') as sql from supabase_migrations.schema_migrations order by version"}' \
            > /tmp/migrations.json; then
            echo "Migration export unavailable with this token (database query API refused)." > supabase/live-snapshot/migrations/_EXPORT_UNAVAILABLE.txt
            exit 0
          fi
          python3 - <<'PY'
          import json, os, re
          rows = json.load(open('/tmp/migrations.json'))
          out = 'supabase/live-snapshot/migrations'
          for r in rows:
              name = re.sub(r'[^a-z0-9_]+', '_', (r['name'] or 'unnamed').lower())
              with open(os.path.join(out, f"{r['version']}_{name}.sql"), 'w') as f:
                  f.write(f"-- Applied in production as version {r['version']} ({r['name']}).\n")
                  f.write("-- Exported read-only by sync-production-snapshot.yml. Do not apply from here.\n\n")
                  f.write((r['sql'] or '').rstrip() + '\n')
          print(f"exported {len(rows)} migrations")
          PY

      - name: Export deployed edge function sources
        # Original source files (entrypoint + every imported module) from the
        # Management API function-body endpoint. _shared modules are stored
        # once per distinct content under live-snapshot/shared/, and each file
        # is compared byte-for-byte with the repo checkout (main) to report
        # exact drift.
        run: |
          set -euo pipefail
          mkdir -p supabase/live-snapshot/functions supabase/live-snapshot/shared
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" -o json > /tmp/functions.json
          python3 - <<'PY'
          import email.parser, email.policy, hashlib, json, os, re, urllib.request
          ref = os.environ["SUPABASE_PROJECT_REF"]; token = os.environ["SUPABASE_ACCESS_TOKEN"]
          root = "supabase/live-snapshot"
          fns = sorted(json.load(open("/tmp/functions.json")), key=lambda f: f["slug"])
          manifest, failures = [], []
          drift = {"identical": [], "differs": [], "not_in_repo": [], "export_failed": []}

          def rel_path(name, slug):
              # The API reports paths relative to the deploy root, e.g.
              # "source/<slug>/index.ts" (dashboard/CLI deploys) or
              # "functions/<slug>/index.ts" (CI deploys); normalise both to
              # "<slug>/index.ts" / "_shared/x.ts" as in supabase/functions.
              name = name.replace("\\", "/")
              if name.startswith("file:"):
                  name = name.split("://", 1)[-1]
              name = "/" + name.lstrip("/")
              for marker in ("/supabase/functions/", "/source/", "/functions/"):
                  if marker in name:
                      name = name.rsplit(marker, 1)[1]
                      break
              name = name.lstrip("/")
              return name if "/" in name else f"{slug}/{name}"

          for f in fns:
              slug = f["slug"]
              entry = {k: f.get(k) for k in ("slug", "version", "status", "verify_jwt", "entrypoint_path", "updated_at", "ezbr_sha256")}
              entry["deployed_via"] = "github_ci" if "/home/runner/work/" in (entry.get("entrypoint_path") or "") else "manual"
              req = urllib.request.Request(
                  f"https://api.supabase.com/v1/projects/{ref}/functions/{slug}/body",
                  headers={"Authorization": f"Bearer {token}", "Accept": "multipart/form-data"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      ctype = resp.headers.get("Content-Type", ""); body = resp.read()
                  if "multipart" not in ctype:
                      raise ValueError(f"unexpected content type {ctype!r}")
                  msg = email.parser.BytesParser(policy=email.policy.default).parsebytes(
                      b"Content-Type: " + ctype.encode() + b"\r\n\r\n" + body)
                  files = []
                  for part in msg.iter_parts():
                      fname = part.get_filename()
                      if not fname or fname.endswith(".json") and "metadata" in fname:
                          continue
                      content = part.get_payload(decode=True) or b""
                      rel = rel_path(fname, slug)
                      sha = hashlib.sha256(content).hexdigest()
                      if rel.startswith("_shared/"):
                          stem, ext = os.path.splitext(rel[len("_shared/"):])
                          out = f"{root}/shared/{stem}@{sha[:10]}{ext}"
                      else:
                          out = f"{root}/functions/{rel}"
                      os.makedirs(os.path.dirname(out), exist_ok=True)
                      open(out, "wb").write(content)
                      repo = f"supabase/functions/{rel}"
                      same = os.path.exists(repo) and open(repo, "rb").read() == content
                      files.append({"path": rel, "sha256": sha, "stored_at": out,
                                    "repo_status": "identical" if same else ("differs" if os.path.exists(repo) else "not_in_repo")})
                  if not files:
                      raise ValueError("no source files in response")
                  entry["files"] = files
                  statuses = {x["repo_status"] for x in files}
                  bucket = "identical" if statuses == {"identical"} else ("not_in_repo" if not os.path.exists(f"supabase/functions/{slug}") else "differs")
                  drift[bucket].append(slug)
              except Exception as e:  # noqa: BLE001 - record and keep exporting
                  failures.append(f"{slug}: {e}")
                  drift["export_failed"].append(slug)
              manifest.append(entry)

          repo_only = sorted(d for d in os.listdir("supabase/functions")
                             if not d.startswith("_") and os.path.isdir(f"supabase/functions/{d}") and d not in {f["slug"] for f in fns})
          drift["repo_only"] = repo_only
          json.dump(manifest, open(f"{root}/functions/_manifest.json", "w"), indent=2)
          json.dump(drift, open(f"{root}/functions/_drift.json", "w"), indent=2)
          open(f"{root}/functions/_download_failures.txt", "w").write("\n".join(failures) + ("\n" if failures else ""))
          print({k: len(v) for k, v in drift.items()}, "failures:", len(failures))
          PY

      - name: Redact secrets
        run: |
          python3 - <<'PY'
          import os, re
          pats = [
            (re.compile(r'eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}'), '<REDACTED_JWT>'),
            (re.compile(r'(secret=)[A-Za-z0-9]{8,}'), r'\1<REDACTED>'),
            (re.compile(r'(sk-[A-Za-z0-9_\-]{4})[A-Za-z0-9_\-]{16,}'), r'\1<REDACTED>'),
            (re.compile(r'(ghp_|github_pat_)[A-Za-z0-9_]{10,}'), r'\1<REDACTED>'),
            (re.compile(r"(['\"]x-(?:vault|heartbeat)-secret['\"]\s*[:,]\s*['\"])[^'\"]{6,}(['\"])", re.I), r'\1<REDACTED>\2'),
          ]
          n = 0
          for root, _, files in os.walk('supabase/live-snapshot'):
              for fn in files:
                  p = os.path.join(root, fn)
                  try:
                      s = open(p, encoding='utf-8').read()
                  except UnicodeDecodeError:
                      continue
                  t = s
                  for rx, rep in pats:
                      t = rx.sub(rep, t)
                  if t != s:
                      open(p, 'w', encoding='utf-8').write(t); n += 1
          print(f"redacted secrets in {n} files")
          PY

      - name: Push snapshot branch
        run: |
          set -euo pipefail
          branch="snapshot/production-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "fkaios-snapshot-bot"
          git config user.email "fkaios-snapshot-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add supabase/live-snapshot
          git commit -m "snapshot: export production migrations and edge function sources (read-only)" || { echo "nothing to snapshot"; exit 0; }
          git push origin "$branch"
          echo "Pushed $branch"
