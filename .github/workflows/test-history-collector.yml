name: Test FKAIOS history collector

on:
  pull_request:
    paths:
      - "tools/fkaios_history_collector.py"
      - "tools/test_fkaios_history_collector.py"
      - ".github/workflows/test-history-collector.yml"
  push:
    branches: [main]
    paths:
      - "tools/fkaios_history_collector.py"
      - "tools/test_fkaios_history_collector.py"
      - ".github/workflows/test-history-collector.yml"

permissions:
  contents: read

jobs:
  collector-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run collector tests
        run: python -m unittest discover -s tools -p "test_fkaios_history_collector.py" -v
